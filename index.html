<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>HELL & BACK · RTS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>

<!-- Three.js + post-processing (importmap so addons can resolve "three") -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
  import * as THREE from 'three';
  import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
  import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
  import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
  import { AfterimagePass }  from 'three/addons/postprocessing/AfterimagePass.js';
  import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';
  window.THREE = THREE;
  window.THREE_POST = { EffectComposer, RenderPass, UnrealBloomPass, AfterimagePass, OutputPass };
  window.__threeReady = true;
  window.dispatchEvent(new Event('three-ready'));
</script>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="soldier.jsx"></script>
<script type="text/babel" src="factions.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
